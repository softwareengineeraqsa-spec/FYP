<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Malware Detection System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    <path d="M9 12l2 2 4-4" />
                </svg>
            </div>
            <h1>AI Malware Detection</h1>
            <p class="subtitle">Advanced ML-powered security analysis for log files</p>
        </div>

        <div class="main-card">
            <form id="upload-form">
                <div class="form-group">
                    <label for="model-type">Attack Detection Model</label>
                    <select id="model-type" name="model_type">
                        <option value="network">Network Attack Detection</option>
                        <option value="system">System Attack Detection</option>
                        <option value="kernel">Kernel Attack Detection</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Upload Log File</label>
                    <div class="file-upload-wrapper" id="file-upload-wrapper">
                        <svg class="file-upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <div class="file-upload-text">Drop your log file here or click to browse</div>
                        <div class="file-upload-subtext">Supports: .log, .txt, .csv, .parquet files (Max 10MB)</div>
                        <input type="file" id="file-input" name="file" accept=".log,.txt,.csv,.parquet" />
                    </div>
                    <div class="file-name" id="file-name"></div>
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">
                    <span>Analyze Log File</span>
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="color: #94a3b8;">Analyzing log file with AI models...</p>
            </div>

            <div id="results"></div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number">99.8%</div>
                <div class="stat-label">Detection Accuracy</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">&lt;2s</div>
                <div class="stat-label">Avg Analysis Time</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">500K+</div>
                <div class="stat-label">Files Analyzed</div>
            </div>
        </div>
    </div>

    <script src="static/scripts.js"></script>
</body>
</html>
